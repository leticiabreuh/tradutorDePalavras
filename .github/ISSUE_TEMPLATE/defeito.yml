name: Reportar defeito
description: Relate um problema encontrado no aplicativo.
title: "[Defeito]: "
body:
  - type: markdown
    attributes:
      value: Descreva o comportamento observado e como reproduzi-lo.
  - type: textarea
    id: problema
    attributes:
      label: Descricao do defeito
      description: O que aconteceu?
      placeholder: Descreva o problema encontrado.
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      description: Quais passos provocam o defeito?
      placeholder: |
        1. Abra o aplicativo.
        2. Acesse a funcionalidade.
        3. Observe o problema.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area afetada
      options:
        - Tela inicial
        - Traducao de palavras
        - Interface e navegacao
        - Outra
    validations:
      required: true
