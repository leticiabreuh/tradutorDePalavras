
name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        working-directory: tradutor_palavras
        run: flutter pub get

      - name: Analisar codigo
        working-directory: tradutor_palavras
        run: flutter analyze

      - name: Executar testes com cobertura
        working-directory: tradutor_palavras
        run: flutter test --coverage

      - name: Verificar cobertura minima de 60%
        working-directory: tradutor_palavras
        shell: bash
        run: |
          awk -F: '
            /^LF:/ { total += $2 }
            /^LH:/ { covered += $2 }
            END {
              if (total == 0) {
                print "Nao foi possivel calcular a cobertura."
                exit 1
              }
              coverage = covered / total * 100
              printf "Cobertura: %.2f%%\n", coverage
              if (coverage < 60) {
                print "Cobertura abaixo do minimo de 60%."
                exit 1
              }
            }
          ' coverage/lcov.info

      - name: Gerar build Web
        working-directory: tradutor_palavras
        run: flutter build web

  dependencias:
    name: dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Revisar dependencias
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs:
      - qualidade
      - dependencias
    if: always()

    steps:
      - name: Verificar resultado dos jobs
        run: |
          test "${{ needs.qualidade.result }}" = "success"
          test "${{ needs.dependencias.result }}" = "success"
